x-hadoop-image: &hadoop-image apache/hadoop@sha256:af361b20bec0dfb13f03279328572ba764926e918c4fe716e197b8be2b08e37f

services:
  namenode:
    image: *hadoop-image
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "127.0.0.1:9870:9870"
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    volumes:
      - ./data:/data

  datanode:
    image: *hadoop-image
    hostname: datanode
    command: ["hdfs", "datanode"]
    env_file:
      - ./config

  resourcemanager:
    image: *hadoop-image
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - ./config

  nodemanager:
    image: *hadoop-image
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config
